name: capture

# Once a day, and on demand. The hour is off the top of the hour on purpose:
# scheduled workflows queue behind everyone else's midnight cron.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A run that overlaps another would race on the same branch. Later wins, and
  # the earlier one is not worth finishing.
  group: capture
  cancel-in-progress: true

env:
  # Pinned deliberately. If the feed tracked the latest Nyrvo, a change in the
  # tool would look exactly like a change in a runner, and this dataset would
  # stop meaning what it claims to mean. Bump it in its own commit, so that
  # commit is the one to blame when every label moves at once.
  NYRVO_VERSION: v0.6.0

jobs:
  # Nyrvo is compiled once, here, and shipped to the runners as a binary.
  #
  # The obvious alternative — `go install` on each runner — does not work and
  # should not be made to work. The macOS images ship no Go at all, so it would
  # need actions/setup-go, and then every macOS snapshot would report the Go
  # version this workflow chose rather than the one the image carries. The
  # instrument would be altering what it measures. Cross-compiling keeps every
  # measured machine free of any toolchain we brought with us.
  build:
    name: build nyrvo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Cross-compile
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/bin"
          # A throwaway module pinned to the release, then `go build -o`, which
          # says where the binary goes. `go install` decides that for itself and
          # moves cross-compiled output into GOPATH/bin/<goos>_<goarch>, so a
          # script that guesses the path is one Go release away from silently
          # producing nothing.
          mkdir -p /tmp/src && cd /tmp/src
          go mod init nyrvo-runners-build >/dev/null
          go get github.com/nyrvo-dev/nyrvo/cmd/nyrvo@${{ env.NYRVO_VERSION }}
          build() {
            GOOS=$1 GOARCH=$2 go build -trimpath \
              -o "$GITHUB_WORKSPACE/bin/nyrvo-$1-$2$3" \
              github.com/nyrvo-dev/nyrvo/cmd/nyrvo
          }
          build linux amd64 ""
          build darwin arm64 ""
          build windows amd64 ".exe"
          ls -l "$GITHUB_WORKSPACE/bin"

      - uses: actions/upload-artifact@v4
        with:
          name: nyrvo-binaries
          path: bin/
          if-no-files-found: error

  capture:
    name: ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.label }}
    strategy:
      # One unavailable label must not cost the other five. A retired runner
      # image is itself a finding, and it should arrive as one missing file
      # rather than as an empty run.
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest
            bin: nyrvo-linux-amd64
          - label: ubuntu-24.04
            bin: nyrvo-linux-amd64
          - label: ubuntu-22.04
            bin: nyrvo-linux-amd64
          - label: macos-latest
            bin: nyrvo-darwin-arm64
          - label: macos-15
            bin: nyrvo-darwin-arm64
          - label: windows-latest
            bin: nyrvo-windows-amd64.exe
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nyrvo-binaries
          path: ${{ runner.temp }}/bin

      - name: Make it runnable
        shell: bash
        run: chmod +x "$RUNNER_TEMP/bin/${{ matrix.bin }}"

      # Deliberately not in a checkout. A capture describes the directory it
      # runs in as well as the machine: inside a repository it would record
      # this repository's own commit and read its files as declared
      # requirements, so every snapshot would churn on data about itself.
      # An empty directory yields the runner and nothing else.
      - name: Capture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/empty"
          cd "$RUNNER_TEMP/empty"
          # A collector that fails is reported on stderr and lands in this log.
          # The snapshot is still written, and a partial observation of a runner
          # is worth more than no observation of it.
          "$RUNNER_TEMP/bin/${{ matrix.bin }}" capture "${{ matrix.label }}" --json \
            > "$RUNNER_TEMP/snapshot.json" \
            || echo "::warning::capture reported collector failures for ${{ matrix.label }}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.label }}
          path: ${{ runner.temp }}/snapshot.json
          if-no-files-found: error

  commit:
    name: commit what changed
    needs: capture
    # Runs even when a label failed, so the labels that did answer are still
    # recorded. A day with five of six is still a day of evidence.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The rendered page dates each runner from its file's last commit, so
          # a shallow clone would report every image as changing today.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: snapshot-*

      # Every matrix job commits through this one step rather than pushing for
      # itself. Six jobs racing on one branch is a lost push at best; one
      # commit a day also makes the git log read as events — "on the 14th,
      # these three runners moved" — which is the whole product.
      - name: Normalise and stage
        run: |
          set -euo pipefail
          for dir in incoming/snapshot-*; do
            label="${dir#incoming/snapshot-}"
            mkdir -p "data/$label"
            # created_at is dropped rather than stored. It changes on every run,
            # so keeping it would produce a commit a day whether or not anything
            # drifted, and the commit's own date already records when we looked.
            # Sorted keys keep the diff about the runner, not about jq.
            jq -S 'del(.created_at)' "$dir/snapshot.json" > "data/$label/current.json"
          done

      # The page is regenerated on every run, but it only reaches a commit when
      # a snapshot moved — the git status check below covers both. "Changed" on
      # the page reads the commit dates, so it needs the full history.
      - name: Render the page
        run: python3 tools/render.py "${{ env.NYRVO_VERSION }}"

      - name: Commit if anything moved
        run: |
          set -euo pipefail
          git config user.name "nyrvo-runners"
          git config user.email "noreply@nyrvo.dev"
          git add data docs
          if git diff --cached --quiet; then
            echo "No runner changed today."
            exit 0
          fi
          # paste -sd', ' would use the comma and the space as two alternating
          # delimiters, not as one separator, which is how the first run
          # produced "a,b c,d".
          changed=$(git diff --cached --name-only \
            | { grep '^data/' || true; } \
            | sed 's|data/||; s|/current.json||' \
            | sort -u | paste -sd, - | sed 's/,/, /g')
          # Only the page moved: the template or the renderer changed, and no
          # runner did. Saying "drift:" with nothing after it would misreport
          # that as an image having moved.
          if [ -z "$changed" ]; then
            git commit -m "chore: regenerate the page"
          else
            git commit -m "drift: $changed"
          fi
          git push
